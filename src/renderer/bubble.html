<!doctype html>
<html>
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="bubble.css"></head>
  <body class="right">
    <main id="bubble" class="bubble" aria-label="Printer statuses"></main>
    <button id="closeBubble" class="close-bubble" type="button" aria-label="Close printer status popup" title="Close">&times;</button>
    <button id="rowResizeHandle" class="row-resize-handle" type="button" aria-label="Show more or fewer printer rows" title="Drag up or down to show more or fewer printers"></button>
    <button id="resizeHandle" class="resize-handle" type="button" aria-label="Resize printer status popup" title="Drag to resize"></button>
    <script src="bubble.js"></script>
  </body>
</html>
